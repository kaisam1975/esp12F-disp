[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  olikraus/U8g2 @ ^2.35.0
extra_scripts = pre:scripts/gen_secrets.py
monitor_speed = 115200

[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
test_framework = unity
