services:
  usage-api:
    build: ./server
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    # Mount the parent DIRECTORIES, not the individual files. Claude Code
    # rewrites .credentials.json by renaming a temp file over it (a new
    # inode each time); a bind mount of the single file stays pinned to
    # the old, now-unlinked inode forever and never sees the refreshed
    # token again. Mounting the directory makes the lookup happen by name
    # on every read, so it always sees the current file. Both directories
    # must already exist on the host before the first `docker compose up`
    # (Docker Desktop/WSL2 silently creates a root-owned directory in
    # place of a missing bind-mount source, which then breaks later reads
    # to that path — confirmed on this machine).
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.grok/logs:/root/.grok/logs:ro
    restart: unless-stopped
